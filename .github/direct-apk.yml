name: Direct Android Studio Compiler

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Fetch Latest Code From Git
      uses: actions/checkout@v4

    - name: 2. Set Up Java JDK 17 Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: 3. Initialize Gradle Automation Cache
      uses: gradle/actions/setup-gradle@v3

    - name: 4. Inject Verified Android SDK Versions
      run: |
        echo "ext { compileSdkVersion = 34; targetSdkVersion = 34; minSdkVersion = 22 }" > android/variables.gradle

    - name: 5. Execute Android Studio CLI Compiler
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon
        
    - name: 6. Upload and Deliver Final APK Package
      uses: actions/upload-artifact@v4
      with:
        name: Little-Star-School-App
        path: android/app/build/outputs/apk/debug/app-debug.apk