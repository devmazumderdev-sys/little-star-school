name: Error Free Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Clean Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Compile Fresh Web Assets
      run: |
        chmod +x node_modules/.bin/vite
        npm run build

    - name: Sync Capacitor Native Bridge
      run: npx cap sync android

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Force Android SDK Versions (Auto Fix)
      run: |
        echo "ext { compileSdkVersion = 34; targetSdkVersion = 34; minSdkVersion = 22 }" > android/variables.gradle

    - name: Execute Android Studio CLI Compiler
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon
        
    - name: Deliver Finished APK Package
      uses: actions/upload-artifact@v4
      with:
        name: Little-Star-School-App
        path: android/app/build/outputs/apk/debug/app-debug.apk